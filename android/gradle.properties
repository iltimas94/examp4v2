org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# JDK untuk Gradle daemon (AGP 8.11.1 + Gradle 8.14 butuh JDK 17-24).
# JANGAN arahkan ke JBR Android Studio: instalasi
# "C:/Program Files/Android/Android Studio/jbr" di mesin ini rusak (lib/jvm.cfg hilang),
# sehingga build gagal dengan:
#   "Unable to determine version for JDK located at ...jbr. Reason: ... could not open ...jvm.cfg"
# Dipakai Microsoft OpenJDK 17.0.20 — sama dengan `flutter config --jdk-dir`
# dan JAVA_HOME level user, jadi Flutter & Gradle memakai JDK yang sama.
org.gradle.java.home=C:/Users/ADMIN/.jdks/ms-17.0.20
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
# Dimatikan kembali (mode klasik KGP): mode built-in Kotlin membuat jar release
# package_info_plus kehilangan class Kotlin-nya (build gagal dengan error
# "cannot find symbol PackageInfoPlugin") karena AGP mengambil alih tugas
# compileReleaseKotlin dari Kotlin Gradle Plugin milik plugin.
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
