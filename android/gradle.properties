org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Memaksa Gradle memakai JDK bawaan Android Studio (JBR 21) yang kompatibel dengan AGP 8.11.1
# (path lama C:/Users/ADMIN/jdk17/... tidak ada di mesin ini sehingga build gagal)
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
# Dimatikan kembali (mode klasik KGP): mode built-in Kotlin membuat jar release
# package_info_plus kehilangan class Kotlin-nya (build gagal dengan error
# "cannot find symbol PackageInfoPlugin") karena AGP mengambil alih tugas
# compileReleaseKotlin dari Kotlin Gradle Plugin milik plugin.
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
