name: examp4
description: "Sebuah Exam Browser"
publish_to: 'none'

version: 1.2.7+13

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # WebView
  flutter_inappwebview: ^6.1.5

  # Lainnya
  http: ^1.3.0
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8
  intl: ^0.20.0
  package_info_plus: ^8.3.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
