name: examp4
description: "Sebuah Exam Browser"
publish_to: 'none'

version: 1.2.5+11

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # WebView
  webview_flutter: ^4.14.0
  webview_flutter_android: ^4.13.0

  # Lainnya
  http: ^1.3.0
  shared_preferences: ^2.5.5
  cupertino_icons: ^1.0.9
  intl: ^0.20.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
